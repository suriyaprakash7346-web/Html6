!DOCTYPE html>
<html lang="en">
<head>

<title>Travel Lists</title>
</head>
<body>

<h1>Travel Lists Example</h1>

<h2>Ordered List (Travel Destinations)</h2>
<ol>
    <li>Paris</li>
    <li>Dubai</li>
    <li>Tokyo</li>
    <li>London</li>
    <li>Singapore</li>
</ol>

<h2>Unordered List (Travel Activities)</h2>
<ul>
    <li>Sightseeing</li>
    <li>Shopping</li>
    <li>Photography</li>
    <li>Camping</li>
    <li>Swimming</li>
</ul>

</body>
</html
